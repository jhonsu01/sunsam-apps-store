<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sunsam Apps Store</title>
  <meta name="description" content="Tienda de apps independiente de Jhon Supelano: descarga directa de APK e instaladores de Windows, verificados con SHA-256, sin depender de Google Play.">
  <meta name="theme-color" content="#f97316">
  <meta property="og:title" content="Sunsam Apps Store">
  <meta property="og:description" content="Apps privadas, sin anuncios y con descarga directa verificada.">
  <meta property="og:image" content="https://jhonsu01.github.io/sunsam-apps-store/img/og.png">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Inicio">
      <img src="logo.svg" alt="" width="34" height="34">
      <span>Sunsam <b>Apps</b></span>
    </a>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.24-1.4 1.4-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
      <input id="q" type="search" placeholder="Buscar apps" autocomplete="off" aria-label="Buscar apps">
    </label>
    <nav class="topnav">
      <a href="#/acerca">Cómo funciona</a>
      <a class="btn-mini" id="get-store" href="#/acerca">Instala la tienda</a>
    </nav>
  </header>

  <main id="view" tabindex="-1"><div class="loading">Cargando catálogo…</div></main>

  <footer class="foot">
    <p>Sunsam Apps Store · catálogo abierto en <a href="https://github.com/jhonsu01/sunsam-apps-store">GitHub</a> · <a href="apps.json">apps.json</a></p>
    <p class="muted">Cada descarga se verifica con SHA-256. Las marcas Google Play y Microsoft Store pertenecen a sus dueños.</p>
  </footer>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="Cerrar">×</button>
    <button class="lb-nav lb-prev" aria-label="Anterior">‹</button>
    <img alt="">
    <button class="lb-nav lb-next" aria-label="Siguiente">›</button>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
